# E29 — GiG Backoffice. Troque gig.app.br pelo domínio registrado do GiG.
# Instalar: sudo cp backoffice.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/backoffice.conf \
#           /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d backoffice.gig.app.br   (renovação automática pelo timer do certbot)
server {
    listen 443 ssl http2;
    server_name backoffice.gig.app.br;
    ssl_certificate     /etc/letsencrypt/live/backoffice.gig.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backoffice.gig.app.br/privkey.pem;

    root /var/www/gig-backoffice;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # API no mesmo endereço (sem CORS; o cookie SameSite=Strict funciona).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;          # backend gig-back
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Rotas do go_router (/sugestoes/123) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html e o bootstrap nunca em cache (senão o navegador segura a versão velha depois de publicar).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache" always;
    }
}

server {
    listen 80;
    server_name backoffice.gig.app.br;
    return 301 https://$host$request_uri;
}
