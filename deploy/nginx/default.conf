# Servido atrás do Caddy (HTTPS, HSTS e /api/ ficam no Caddy). Porta 8080 (nginx-unprivileged).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # Rotas do go_router (/sugestoes/123) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html e o bootstrap nunca em cache (senão o navegador segura a versão velha depois de publicar).
    # add_header em location substitui os do server: repetimos os de segurança.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache" always;
    }
}
